name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt

      - name: Check syntax
        run: python -m compileall -q custom_components tests

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: python -m pytest --cov=custom_components.co2saver --cov-report=term-missing

  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate with Home Assistant 2026.9.0 hassfest
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/github/workspace"
          ghcr.io/home-assistant/hassfest@sha256:5344a867c00d7c45b0d8db9f5cb09abe6f65b8e2fc2bad636bb5bd35c1740f2e
