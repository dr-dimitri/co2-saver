[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "co2saver-ha"
version = "0.0.0"
description = "Transparent CO2 savings from self-consumed photovoltaic energy in Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"
authors = [{ name = "CO2 Saver contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Other Environment",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://github.com/dr-dimitri/co-saver#readme"
Issues = "https://github.com/dr-dimitri/co-saver/issues"
Repository = "https://github.com/dr-dimitri/co-saver"

[project.optional-dependencies]
test = [
  "homeassistant==2026.9.0",
  "mypy==2.3.1",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.363",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/co2saver"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/co2saver"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
